name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm turbo run lint typecheck test build build:devtools

      # The reliability panel must never ship: dist/ may not contain its marker, and the
      # devtools build must (proving the check can find it).
      - name: Devtools excluded from the production bundle
        run: pnpm --filter @pulsedesk/web check:devtools-excluded --strict

  e2e:
    name: End-to-end (Playwright)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Production build for the app specs, plus the devtools build the reliability spec
      # drives through its fault-injection panel. Playwright then starts the whole stack
      # itself (tests/playwright.config.ts): gateway, simulator with a fixed seed,
      # ai-service with the mock provider, and three web servers (production, devtools,
      # and production with the gateway unreachable for the error and outage states).
      - run: pnpm build && pnpm build:devtools

      - name: Install Playwright browser
        run: pnpm --filter @pulsedesk/tests exec playwright install --with-deps chromium

      - run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # The HTML report, and the trace of each test that failed and was retried.
          path: |
            tests/playwright-report
            tests/test-results
          retention-days: 7
